<canvas id="coarse" aria-hidden="true"></canvas>
<canvas id="fine" class="fine" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<script>
(() => {
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  // coarse clumps (scale 3) + fine grain (scale 1.5), redrawn ~18 times a second
  const layers = [
    { el: document.getElementById("coarse"), scale: 3, amp: 170 },
    { el: document.getElementById("fine"), scale: 1.5, amp: 130 },
  ];
  function size() {
    for (const L of layers) {
      L.el.width = Math.ceil(innerWidth / L.scale);
      L.el.height = Math.ceil(innerHeight / L.scale);
      L.ctx = L.el.getContext("2d");
      L.img = L.ctx.createImageData(L.el.width, L.el.height);
      L.buf = new Uint32Array(L.img.data.buffer);
    }
  }
  function frame() {
    for (const L of layers) {
      const b = L.buf, a = L.amp;
      for (let i = 0; i < b.length; i++) {
        const v = 128 + ((Math.random() + Math.random() - 1) * a) | 0;
        b[i] = 0xff000000 | (v << 16) | (v << 8) | v;
      }
      L.ctx.putImageData(L.img, 0, 0);
    }
  }
  size(); frame();
  addEventListener("resize", () => { size(); frame(); });
  if (still) return;
  let last = 0;
  (function loop(t) {
    if (t - last > 55) { frame(); last = t; }
    requestAnimationFrame(loop);
  })(0);
})();
</script>
